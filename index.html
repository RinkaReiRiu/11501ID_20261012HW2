<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跳躍旋轉的貓咪</title>

  <style>
    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: linear-gradient(135deg, #ffe5ec, #dff5ff);
    }

    canvas {
      display: block;
    }

    .title {
      position: fixed;
      top: 30px;
      width: 100%;
      text-align: center;
      color: #4b3b47;
      font-family: sans-serif;
      font-size: 28px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="title">Model from https://skfb.ly/o8yrL</div>

  <script type="module">
    import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
    import { GLTFLoader } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
    import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";

    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      45,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );

    camera.position.set(0, 1.5, 5);

    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: true
    });

    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    document.body.appendChild(renderer.domElement);

    // 環境光
    const ambientLight = new THREE.HemisphereLight(
      0xffffff,
      0x8899aa,
      2
    );

    scene.add(ambientLight);

    // 主燈光
    const directionalLight = new THREE.DirectionalLight(0xffffff, 3);
    directionalLight.position.set(3, 5, 4);
    directionalLight.castShadow = true;

    scene.add(directionalLight);

    // 地面
    const ground = new THREE.Mesh(
      new THREE.CircleGeometry(2.2, 64),
      new THREE.MeshStandardMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.35
      })
    );

    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -1.25;
    ground.receiveShadow = true;

    scene.add(ground);

    // 貓咪模型容器
    const cat = new THREE.Group();
    scene.add(cat);

    const loader = new GLTFLoader();

    loader.load(
      "./models/cat.glb",
      (gltf) => {
        const model = gltf.scene;

        model.traverse((object) => {
          if (object.isMesh) {
            object.castShadow = true;
            object.receiveShadow = true;
          }
        });

        model.scale.set(1.5, 1.5, 1.5);
        model.position.y = -1.1;

        cat.add(model);

        // 如果模型內有動畫，播放第一個動畫
        if (gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(model);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();

          cat.userData.mixer = mixer;
        }
      },
      undefined,
      (error) => {
        console.error("模型載入失敗：", error);
      }
    );

    // 可用滑鼠拖曳視角
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 3;
    controls.maxDistance = 8;

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);

      const elapsed = clock.getElapsedTime();
      const delta = clock.getDelta();

      // 持續旋轉
      cat.rotation.y += 0.02;

      // 上下跳躍
      const jumpHeight = 0.45;
      const jumpSpeed = 2.4;

      cat.position.y = Math.abs(Math.sin(elapsed * jumpSpeed)) * jumpHeight;

      // 模型內建動畫
      if (cat.userData.mixer) {
        cat.userData.mixer.update(delta);
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
